name: Collect Phoenix AIS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: phoenix-ais-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect Open Waters AIS observations
        run: python3 scripts/collect_phoenix_ais.py

      - name: Commit new track points
        shell: bash
        run: |
          if git diff --quiet -- phoenix-do-mar-track.json; then
            echo "No new coordinate-bearing AIS observations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phoenix-do-mar-track.json
          git commit -m "Update Phoenix AIS track"
          git push
